<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Getting into the recovery menu">
<rect width="960" height="340" fill="#1B1A18"/>
<text x="480.0" y="46" font-size="26" fill="#F3EFE8" font-weight="700" text-anchor="middle">Getting into the recovery menu</text>
<rect x="24" y="76" width="210" height="216" rx="14" fill="#24221F" stroke="#3A3733" stroke-width="2"/>
<circle cx="54" cy="106" r="18" fill="#E0A85A"/><text x="54" y="113" font-size="20" fill="#1B1A18" font-weight="700" text-anchor="middle">1</text>
<rect x="107" y="142" width="44" height="36" rx="8" fill="#F3EFE8"/><rect x="117" y="126" width="6" height="16" fill="#F3EFE8"/><rect x="135" y="126" width="6" height="16" fill="#F3EFE8"/><path d="M129 178 v26" stroke="#F3EFE8" stroke-width="6" fill="none"/><path d="M89 120 L169 200" stroke="#E0A85A" stroke-width="6" stroke-linecap="round"/>
<text x="129" y="246" font-size="17" fill="#F3EFE8" font-weight="700" text-anchor="middle">Unplug it</text>
<text x="129" y="270" font-size="15" fill="#ABA59B" font-weight="400" text-anchor="middle">so it's switched off</text>
<rect x="258" y="76" width="210" height="216" rx="14" fill="#24221F" stroke="#3A3733" stroke-width="2"/>
<circle cx="288" cy="106" r="18" fill="#E0A85A"/><text x="288" y="113" font-size="20" fill="#1B1A18" font-weight="700" text-anchor="middle">2</text>
<rect x="291" y="142" width="44" height="36" rx="8" fill="#F3EFE8"/><rect x="301" y="126" width="6" height="16" fill="#F3EFE8"/><rect x="319" y="126" width="6" height="16" fill="#F3EFE8"/><path d="M313 178 v26" stroke="#F3EFE8" stroke-width="6" fill="none"/>
<rect x="365" y="124" width="52" height="30" rx="8" fill="#E0A85A" stroke="#E0A85A" stroke-width="2"/><text x="391" y="145" font-size="14" fill="#1B1A18" font-weight="700" text-anchor="middle">Vol +</text><rect x="365" y="158" width="52" height="30" rx="8" fill="#E0A85A" stroke="#E0A85A" stroke-width="2"/><text x="391" y="179" font-size="14" fill="#1B1A18" font-weight="700" text-anchor="middle">Vol −</text><rect x="365" y="192" width="52" height="30" rx="8" fill="#F3EFE8" stroke="#E0A85A" stroke-width="2"/><path d="M386 201 A8 8 0 1 0 396 201" fill="none" stroke="#1B1A18" stroke-width="2.5" stroke-linecap="round"/><path d="M391 197 V206" stroke="#1B1A18" stroke-width="2.5" stroke-linecap="round"/>
<text x="363" y="246" font-size="17" fill="#F3EFE8" font-weight="700" text-anchor="middle">Hold all three</text>
<text x="363" y="270" font-size="15" fill="#ABA59B" font-weight="400" text-anchor="middle">and plug it back in</text>
<rect x="492" y="76" width="210" height="216" rx="14" fill="#24221F" stroke="#3A3733" stroke-width="2"/>
<circle cx="522" cy="106" r="18" fill="#E0A85A"/><text x="522" y="113" font-size="20" fill="#1B1A18" font-weight="700" text-anchor="middle">3</text>
<rect x="537.0" y="121.0" width="120" height="78" rx="6" fill="#019DF4" stroke="#F3EFE8" stroke-width="3"/><text x="597" y="166" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">movistar</text>
<text x="597" y="246" font-size="17" fill="#F3EFE8" font-weight="700" text-anchor="middle">The blue Movistar</text>
<text x="597" y="270" font-size="15" fill="#ABA59B" font-weight="400" text-anchor="middle">logo shows: keep holding</text>
<rect x="726" y="76" width="210" height="216" rx="14" fill="#24221F" stroke="#3A3733" stroke-width="2"/>
<circle cx="756" cy="106" r="18" fill="#E0A85A"/><text x="756" y="113" font-size="20" fill="#1B1A18" font-weight="700" text-anchor="middle">4</text>
<rect x="771.0" y="121.0" width="120" height="78" rx="6" fill="#1E2226" stroke="#F3EFE8" stroke-width="3"/><rect x="779.0" y="129.0" width="104" height="62" rx="4" fill="#262C31"/>
<text x="831" y="246" font-size="17" fill="#F3EFE8" font-weight="700" text-anchor="middle">It goes dark, but lit:</text>
<text x="831" y="270" font-size="15" fill="#ABA59B" font-weight="400" text-anchor="middle">let go right away</text>
<text x="480.0" y="324" font-size="15" fill="#847E74" font-weight="400" text-anchor="middle">Power is the white button on the back, next to the power socket.</text>
</svg>
