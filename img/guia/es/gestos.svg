<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Gestos para Atrás, Inicio y Recientes">
<defs><marker id="p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E0A85A"/></marker><marker id="pg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#847E74"/></marker></defs>
<rect width="960" height="400" fill="#1B1A18"/>
<text x="480" y="46" font-size="26" fill="#F3EFE8" font-weight="700" text-anchor="middle">Home se maneja con gestos</text>
<text x="480" y="74" font-size="16" fill="#ABA59B" text-anchor="middle">No hay botones en pantalla: estos tres gestos hacen lo mismo que Atrás, Inicio y Recientes</text>
<rect x="45.0" y="96" width="260" height="166" rx="16" fill="#24221F" stroke="#3A3733" stroke-width="2"/><rect x="53.0" y="104" width="244" height="150" rx="8" fill="#34312C"/>
<rect x="147.0" y="244" width="56" height="5" rx="2.5" fill="#F3EFE8"/>
<rect x="350.0" y="96" width="260" height="166" rx="16" fill="#24221F" stroke="#3A3733" stroke-width="2"/><rect x="358.0" y="104" width="244" height="150" rx="8" fill="#34312C"/>
<rect x="452.0" y="244" width="56" height="5" rx="2.5" fill="#F3EFE8"/>
<rect x="655.0" y="96" width="260" height="166" rx="16" fill="#24221F" stroke="#3A3733" stroke-width="2"/><rect x="663.0" y="104" width="244" height="150" rx="8" fill="#34312C"/>
<rect x="757.0" y="244" width="56" height="5" rx="2.5" fill="#F3EFE8"/>
<circle cx="64" cy="164" r="11" fill="#E0A85A" fill-opacity="0.3" stroke="#E0A85A" stroke-width="2"/>
<line x1="76" y1="164" x2="146" y2="164" stroke="#E0A85A" stroke-width="4" stroke-linecap="round" marker-end="url(#p)"/>
<line x1="290" y1="204" x2="222" y2="204" stroke="#847E74" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#pg)"/>
<text x="175" y="232" fill="#847E74" font-size="12" text-anchor="middle">también desde la derecha</text>
<circle cx="480" cy="236" r="11" fill="#E0A85A" fill-opacity="0.3" stroke="#E0A85A" stroke-width="2"/>
<line x1="480" y1="222" x2="480" y2="150" stroke="#E0A85A" stroke-width="4" stroke-linecap="round" marker-end="url(#p)"/>
<g fill="#F3EFE8" fill-opacity="0.12" stroke="#F3EFE8" stroke-opacity="0.25"><rect x="690" y="116" width="54" height="40" rx="5"/><rect x="758" y="116" width="54" height="40" rx="5"/><rect x="826" y="116" width="54" height="40" rx="5"/></g>
<circle cx="785" cy="236" r="11" fill="#E0A85A" fill-opacity="0.3" stroke="#E0A85A" stroke-width="2"/>
<line x1="785" y1="222" x2="785" y2="188" stroke="#E0A85A" stroke-width="4" stroke-linecap="round"/>
<circle cx="785" cy="180" r="9" fill="#E0A85A"/>
<circle cx="785" cy="180" r="17" fill="none" stroke="#E0A85A" stroke-width="2" stroke-dasharray="4 4"/>
<text x="815" y="185" fill="#E0A85A" font-size="13">mantén</text>
<circle cx="175" cy="294" r="18" fill="none" stroke="#3A3733" stroke-width="2"/><circle cx="480" cy="294" r="18" fill="none" stroke="#3A3733" stroke-width="2"/><circle cx="785" cy="294" r="18" fill="none" stroke="#3A3733" stroke-width="2"/><g fill="none" stroke="#F3EFE8" stroke-width="2.5" stroke-linejoin="round"><path d="M181 285 L181 303 L167 294 Z"/><circle cx="480" cy="294" r="7.5"/><rect x="778" y="287" width="14" height="14" rx="2"/></g>
<text x="175" y="340" font-size="22" fill="#F3EFE8" font-weight="700" text-anchor="middle">Atrás</text>
<text x="175" y="366" font-size="15" fill="#ABA59B" text-anchor="middle">Desliza desde el borde izquierdo</text>
<text x="175" y="386" font-size="15" fill="#ABA59B" text-anchor="middle">o derecho hacia el centro</text>
<text x="480" y="340" font-size="22" fill="#F3EFE8" font-weight="700" text-anchor="middle">Inicio</text>
<text x="480" y="366" font-size="15" fill="#ABA59B" text-anchor="middle">Desliza hacia arriba desde</text>
<text x="480" y="386" font-size="15" fill="#ABA59B" text-anchor="middle">la barrita de abajo</text>
<text x="785" y="340" font-size="22" fill="#F3EFE8" font-weight="700" text-anchor="middle">Recientes</text>
<text x="785" y="366" font-size="15" fill="#ABA59B" text-anchor="middle">Desliza hacia arriba, para a media</text>
<text x="785" y="386" font-size="15" fill="#ABA59B" text-anchor="middle">pantalla y mantén un momento</text>
</svg>
